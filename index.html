      <div class="table-wrap"><table><thead><tr><th>Élève</th><th>Identifiant</th><th>Code</th></tr></thead><tbody>${lastCreated.map(r=>`<tr><td>${h(r.nom)} ${h(r.prenom)}</td><td class="mono">${h(r.identifiant)}</td><td class="mono">${h(r.code)}</td></tr>`).join("")}</tbody></table></div>
      <div class="row"><button class="btn" id="copyCodes">Copier le tableau</button><button class="btn" id="csvCodes">Télécharger (.csv)</button></div></div>`:""}
    ${S.students.length?accountsListHTML(classes):""}
    ${classes.length?`<div class="card"><h3>Classes</h3>
      <p class="small muted">Supprimer une classe efface les comptes de tous ses élèves, leurs fiches, photos, périodes et commentaires. À faire en fin de cycle, après la commission CCF.</p>
      <div class="table-wrap"><table><thead><tr><th>Classe</th><th class="num">Élèves</th><th class="num">Dépôts</th><th></th></tr></thead><tbody>
      ${classes.map(c=>{ const ids=S.students.filter(s=>s.classe===c).map(s=>s.id); const nd=S.allEntries.filter(e=>ids.includes(e.eleve_id)).length;
        return `<tr><td><b>${h(c)}</b></td><td class="num">${ids.length}</td><td class="num">${nd}</td><td><button type="button" class="btn small danger" data-delclass="${h(c)}">Supprimer la classe</button></td></tr>`; }).join("")}
      </tbody></table></div></div>`:""}
    <p class="small muted" id="delProg" hidden></p>
  </div>`;
}
afterRender.accounts=()=>{
  $("#accForm").addEventListener("submit",async ev=>{ ev.preventDefault();
    const cls=$("#accCls").value.trim(); const lines=$("#accList").value.split(/\n/).map(l=>l.trim()).filter(Boolean);
    if(!lines.length){ toast("Collez au moins un nom"); return; }
    const btn=$("#accBtn"); btn.disabled=true; const pr=$("#accProg"); pr.hidden=false; const out=[]; const errs=[];
    for(let i=0;i<lines.length;i++){
      const parts=lines[i].split(/[\s;,\t]+/).filter(Boolean); let nom,prenom;
      const up=parts.filter(p=>p===p.toUpperCase() && /[A-Z]/.test(p));
      if(up.length && up.length<parts.length){ nom=up.join(" "); prenom=parts.filter(p=>!up.includes(p)).join(" "); } else { nom=parts[0]; prenom=parts.slice(1).join(" ")||""; }
      pr.textContent=`Création ${i+1} / ${lines.length} : ${prenom} ${nom}`;
      try{ const r=await Store.createStudent({nom,prenom,classe:cls}); out.push({nom:nom.toUpperCase(),prenom,...r}); }catch(x){ errs.push(x.message); if(/Confirm email/.test(x.message)) break; }
    }
    lastCreated=out; await refresh(); render();
    if(errs.length) toast(errs[0]); else toast(plural(out.length,"compte créé","comptes créés"));
  });
  $("#accFilter")?.addEventListener("change",ev=>{ accCls=ev.target.value; render(); });
  $("#accAll")?.addEventListener("change",ev=>{ S.students.filter(s=>!accCls||s.classe===accCls).forEach(s=>ev.target.checked?accSel.add(s.id):accSel.delete(s.id)); render(); });
  document.querySelectorAll(".accChk").forEach(c=>c.addEventListener("change",()=>{ c.checked?accSel.add(c.value):accSel.delete(c.value); render(); }));
  $("#delSel")?.addEventListener("click",async()=>{
    const list=S.students.filter(s=>accSel.has(s.id)&&(!accCls||s.classe===accCls)); if(!list.length) return;
    if(await confirmBox(`Supprimer ${plural(list.length,"élève","élèves")} ?`,`${list.slice(0,6).map(s=>s.prenom+" "+s.nom).join(", ")}${list.length>6?"…":""}. Leurs comptes, fiches, photos et périodes seront effacés définitivement.`)) runDeletion(list, plural(list.length,"élève supprimé","élèves supprimés"));
  });
  document.querySelectorAll("[data-delclass]").forEach(b=>b.addEventListener("click",async()=>{
    const c=b.dataset.delclass; const list=S.students.filter(s=>s.classe===c);
    if(await confirmTyped(`Supprimer la classe ${c} ?`,`${plural(list.length,"compte élève","comptes élèves")} et toutes leurs données (fiches, photos, périodes, commentaires) seront effacés définitivement.`, c)){
      if(S.classe===c) S.classe=""; if(accCls===c) accCls=""; runDeletion(list,`Classe ${c} supprimée`); }
  }));
  const txt=()=>lastCreated.map(r=>`${r.nom} ${r.prenom}\t${r.identifiant}\t${r.code}`).join("\n");
  $("#copyCodes")?.addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText("Élève\tIdentifiant\tCode\n"+txt()); toast("Tableau copié"); }catch(e){ toast("Copie impossible : sélectionnez le tableau à la main"); } });
  $("#csvCodes")?.addEventListener("click",()=>{ const csv="﻿Nom;Prénom;Identifiant;Code\r\n"+lastCreated.map(r=>[r.nom,r.prenom,r.identifiant,r.code].join(";")).join("\r\n"); saveFile(`codes_eleves_${today()}.csv`,new Blob([csv],{type:"text/csv"})); });
};

/* =====================================================================
   ACTIONS GLOBALES (délégation)
   ===================================================================== */
const history_ = [];
document.addEventListener("click",async ev=>{
  const cp=ev.target.closest("[data-copy]");
  if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); toast("Lien copié"); }catch(e){ const c=cp.parentElement.querySelector("code"); if(c){ const r=document.createRange(); r.selectNodeContents(c); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Sélectionnez le lien et copiez-le"); } return; }
  const rn=ev.target.closest("[data-renew]");
  if(rn){ const p=S.allPeriodes.find(x=>x.id===rn.dataset.renew); if(p && await confirmBox("Créer un nouveau lien ?","L'ancien lien ne fonctionnera plus. Il faudra envoyer le nouveau au tuteur.","Nouveau lien")){ try{ await Store.renewToken(p); await refresh(); toast("Nouveau lien créé"); render(); }catch(x){ toast(x.message); } } return; }
  const cn=ev.target.closest("[data-calnav]");
  if(cn){ const st=S.cal[cn.dataset.calkey]; const k=+cn.dataset.calnav;
    if(k===0){ st.ym=today().slice(0,7); st.sel=today(); } else { const [y,m]=st.ym.split("-").map(Number); const d=new Date(y,m-1+k,1); st.ym=iso(d).slice(0,7); st.sel=null; }
    render(); return; }
  const cd=ev.target.closest("[data-calday]");
  if(cd){ const st=S.cal[cd.dataset.calkey]; st.sel = st.sel===cd.dataset.calday ? null : cd.dataset.calday; render(); return; }
  const sc=ev.target.closest("[data-setcls]");
  if(sc){ S.classe=sc.dataset.setcls; S.pf={...S.pf,classe:sc.dataset.setcls||undefined}; go("home"); return; }
  const sx=ev.target.closest("[data-startex]");
  if(sx && S.me){ const x=exOf(sx.dataset.startex); startDraft("fiche"); const e=S.draft.entry;
    e.titre=x.t; e.activite=x.a; e.competences=[...x.c]; e.materiel=[...x.m]; e.exemple=x.id; pushRecent("ex",[x.id]);
    history_.push([S.view,S.p]); go("fiche"); return; }
  const t=ev.target.closest("[data-go],[data-open],[data-back],[data-cancel],[data-edit],[data-del],[data-tofiche],[data-editper],[data-delperprof],[data-pfgo],[data-student],[data-report],[data-delcom],[data-dlfile],[data-delstudent]");
  if(!t || !S.me) return;
  const d=t.dataset;
  if(d.go){ if(d.go==="fiche"||d.go==="journal"){ if(!S.draft||S.draft.entry.type!==d.go||S.draft.entry.id) S.draft=null; } history_.push([S.view,S.p]); go(d.go); }
  else if(d.open){ history_.push([S.view,S.p]); go("entry",{id:d.open}); }
  else if("back" in d){ const prev=history_.pop(); if(prev) go(prev[0],prev[1]); else go("home"); }
  else if("cancel" in d){ if(await confirmBox("Abandonner ?","Ce que vous avez saisi ne sera pas enregistré.","Abandonner")){ S.draft=null; const prev=history_.pop(); prev?go(prev[0],prev[1]):go("home"); } }
  else if(d.edit){ const e=findEntry(d.edit); startDraft(e.type,e); go(e.type==="fiche"?"fiche":"journal"); }
  else if(d.tofiche){ const e=findEntry(d.tofiche); startDraft("fiche",e); go("fiche"); }
  else if(d.del){ const e=findEntry(d.del); if(await confirmBox("Supprimer ce dépôt ?","La fiche et ses photos seront effacées définitivement.")){ try{ await Store.deleteEntry(e); await refresh(); toast("Dépôt supprimé"); go("dossier"); }catch(x){ toast(x.message); } } }
  else if(d.editper){ history_.push([S.view,S.p]); go("pfmpForm",{id:d.editper}); }
  else if(d.delperprof){ const p=S.allPeriodes.find(x=>x.id===d.delperprof); if(await confirmBox("Retirer cette période ?","Les fiches de l'élève sont conservées mais ne seront plus rattachées à cette entreprise.","Retirer")){ try{ await Store.deletePeriode(p); await refresh(); toast("Période retirée"); render(); }catch(x){ toast(x.message); } } }
  else if(d.pfgo){ const [c,n]=d.pfgo.split("|"); S.pf={classe:c,numero:+n||1}; history_.push([S.view,S.p]); go("periodes"); }
  else if(d.student){ history_.push([S.view,S.p]); go("student",{id:d.student}); }
  else if(d.report){ history_.push([S.view,S.p]); go("report",{eleve:d.report}); }
  else if(d.delcom){ const c=S.comments.find(x=>x.id===d.delcom); if(await confirmBox("Effacer ce commentaire ?","L'élève ne le verra plus.","Effacer")){ await Store.deleteComment(c); S.comments=S.comments.filter(x=>x.id!==c.id); render(); } }
  else if(d.dlfile){ const b=await Store.fileBlob(d.dlfile); if(b) saveFile(d.name||"fichier",b); else toast("Fichier introuvable"); }
  else if(d.delstudent){ const s=S.students.find(x=>x.id===d.delstudent); if(await confirmBox(`Supprimer ${s.prenom} ${s.nom} ?`,"Son compte, ses fiches, ses photos et ses périodes seront effacés définitivement.")){ try{ await Store.deleteStudent(s); await refresh(); toast("Élève supprimé"); go(S.view==="accounts"?"accounts":"home"); }catch(x){ toast(x.message); } } }
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter" && ev.target.matches("tr[data-student]")) ev.target.click(); });
$("#logoutBtn").addEventListener("click",async()=>{ if(S.tutor){ S.tutor=null; try{ history.replaceState(null,"",location.pathname); }catch(e){} render(); return; } await Store.logout(); S.me=null; S.draft=null; history_.length=0; go("home"); });

/* Le professeur voit les commentaires de tous les dépôts : on les charge à l'ouverture d'un élève */
const _go=go;
go = function(view,p={}){
  if(S.me?.role==="prof" && (view==="student"||view==="entry")){
    const ids = view==="student" ? S.allEntries.filter(e=>e.eleve_id===p.id).map(e=>e.id) : [p.id];
    Store.listComments(ids).then(cs=>{ const keep=S.comments.filter(c=>!ids.includes(c.entry_id)); S.comments=[...keep,...cs]; if(S.view===view) render(); });
  }
  _go(view,p);
};

/* Palettes de couleurs (mémorisées sur l'appareil) */
const PALETTES=[["geometre","Ma PFMP","#1F4F8F","#5DAF5A"],["lavande","Lavande","#6F5DD3","#B5D36A"],["corail","Corail","#DD6B5A","#EDBF55"],["ocean","Océan","#3A72CF","#EDBF55"],["menthe","Menthe","#2C9C79","#E58CA6"]];
function applyPalette(k){ if(!PALETTES.some(p=>p[0]===k)) k="geometre"; document.documentElement.setAttribute("data-palette",k); try{ localStorage.setItem("carnet-palette",k); }catch(e){} 
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content="#FFFFFF"; return k; }
let curPal=(()=>{ try{ return localStorage.getItem("carnet-palette")||"geometre"; }catch(e){ return "geometre"; } })(); curPal=applyPalette(curPal);
function renderPal(){ $("#palPop").innerHTML=`<b>Couleurs de l'appli</b>${PALETTES.map(([k,l,a,b])=>`<button type="button" class="pal-opt${k===curPal?" on":""}" data-pal="${k}"><i style="background:conic-gradient(${a} 0 50%,${b} 50% 100%)"></i>${l}</button>`).join("")}`; }
$("#palBtn").addEventListener("click",ev=>{ ev.stopPropagation(); const pop=$("#palPop"); pop.hidden=!pop.hidden; $("#palBtn").setAttribute("aria-expanded",String(!pop.hidden)); if(!pop.hidden) renderPal(); });
$("#palPop").addEventListener("click",ev=>{ ev.stopPropagation(); const b=ev.target.closest("[data-pal]"); if(!b) return; curPal=applyPalette(b.dataset.pal); renderPal(); });
document.addEventListener("click",()=>{ const pop=$("#palPop"); if(!pop.hidden){ pop.hidden=true; $("#palBtn").setAttribute("aria-expanded","false"); } });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"){ $("#palPop").hidden=true; } });
/* En-tête personnalisé selon CONFIG */
$("#brandMain").textContent=CONFIG.DIPLOME; $("#brandSub").textContent=CONFIG.LYCEE;
/* Application installable : service worker (ignoré hors https ou dans un aperçu) */
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
/* Démarrage */
(async()=>{
  try{
    await Store.init();
    const qs=new URLSearchParams(location.search); const hm=/^#tuteur-([0-9a-zA-Z-]{6,})$/.exec(location.hash||"");
    const tok=qs.get("tuteur")||(hm&&hm[1]);
    if(tok){ openTutor(tok); return; }
    S.me = await Store.session();
    if(S.me) await refresh();
  }catch(x){
    $("#view").innerHTML=`<div class="card"><h2>Connexion au serveur impossible</h2><p>${h(x.message)}</p><p class="small muted">Vérifiez la connexion internet puis rechargez la page.</p></div>`; return;
  }
  render();
})();
</script>
