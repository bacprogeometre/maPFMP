<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ma PFMP</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="application-name" content="Ma PFMP">
<meta name="apple-mobile-web-app-title" content="Ma PFMP">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body>
<style>
/* Layout : appli mobile d'abord — barre du haut, contenu en colonne unique (max 760px), onglets en bas pour l'élève.
   Thème clair. 5 palettes au choix (bouton « Couleurs ») : Ma PFMP (couleurs du logo, défaut), lavande, corail, océan, menthe.
   --accent = couleur principale, --accent-2 = son dégradé, --pop = couleur flash pour les petits accents. */
:root{
  --surface:#FFFFFF; --mark:#E5484D; --mark-soft:#FDEBEC; --ok:#18A058; --ok-soft:#E2F6EA; --warn:#C27B0A; --warn-soft:#FFF4DB;
  --bg:#F4F7FB; --sunk:#E9EFF6; --line:#DCE4EE; --ink:#13243F; --muted:#586679;
  --accent:#1F4F8F; --accent-2:#3E72B5; --accent-ink:#163E73; --accent-soft:#E4ECF7; --on-accent:#FFFFFF;
  --pop:#5DAF5A; --pop-ink:#2B6A2B; --pop-soft:#E6F3E4;
  --glow:color-mix(in srgb,var(--accent) 18%,transparent);
  --shadow:0 1px 2px rgba(25,20,46,.04),0 8px 24px rgba(25,20,46,.06);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --tab-h:64px; color-scheme:light;
}
:root[data-palette="lavande"]{ --bg:#F8F7FD; --sunk:#EFEDF9; --line:#E5E1F5; --ink:#1E1A33; --muted:#655F7E;
  --accent:#6F5DD3; --accent-2:#9385E3; --accent-ink:#4E3FAE; --accent-soft:#EFECFB; --pop:#B5D36A; --pop-ink:#465811; --pop-soft:#F1F6DF }
:root[data-palette="corail"]{ --bg:#FDF8F6; --sunk:#F8EDE8; --line:#F0E1DB; --ink:#2A1A17; --muted:#77605A;
  --accent:#DD6B5A; --accent-2:#EC977D; --accent-ink:#B14738; --accent-soft:#FBECE8; --pop:#EDBF55; --pop-ink:#664A00; --pop-soft:#FBF2DB }
:root[data-palette="ocean"]{ --bg:#F5F8FD; --sunk:#E9F0FA; --line:#DCE6F5; --ink:#132036; --muted:#566379;
  --accent:#3A72CF; --accent-2:#64A3DC; --accent-ink:#2656A8; --accent-soft:#E7EFFB; --pop:#EDBF55; --pop-ink:#664A00; --pop-soft:#FBF2DB }
:root[data-palette="menthe"]{ --bg:#F4FAF7; --sunk:#E6F3ED; --line:#D8ECE2; --ink:#12261E; --muted:#526B61;
  --accent:#2C9C79; --accent-2:#68C3A3; --accent-ink:#1E765B; --accent-soft:#E2F4EC; --pop:#E58CA6; --pop-ink:#872846; --pop-soft:#FBE8EE }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:1.85rem;font-weight:800} h2{font-size:1.3rem} h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.eyebrow{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand strong{font:800 1.05rem/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.logo-img{flex:none;width:44px;height:44px;display:block}
.login-logo{display:block;width:260px;max-width:80%;height:auto;margin:8px auto 4px}
.logo{flex:none;width:40px;height:40px;border-radius:14px;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:600 .82rem/1 var(--f-display);letter-spacing:.06em}
.brand-sub{font-size:.82rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* panneau d'accueil */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.hero .head{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--on-accent);padding:20px 18px 18px;display:flex;flex-direction:column;gap:4px}
.hero .head::after{content:"";position:absolute;right:-46px;bottom:-64px;width:150px;height:150px;border-radius:50%;background:var(--pop);opacity:.28;pointer-events:none}
.hero .head > *{position:relative;z-index:1}
.hero .kicker{font:500 .72rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:2rem;color:inherit;max-width:80%}
.hero .sub{align-self:flex-start;margin-top:4px;background:var(--pop-soft);color:var(--pop-ink);font-size:.85rem;font-weight:700;padding:5px 12px;border-radius:999px}
.hero .in{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:0}
.facts div{min-width:0;display:flex;flex-direction:column;gap:2px}
.facts dt{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.facts dd small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .lab{display:flex;justify-content:space-between;font-size:.88rem;font-weight:500;color:var(--muted)}
.prog .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px}
.state{display:inline-flex;align-self:flex-start;font:500 .78rem/1 var(--f-mono);padding:6px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}

/* exemples d'activités */
.ex-list{display:flex;flex-direction:column;gap:6px}
.ex{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.ex:hover{border-color:var(--accent)}
.ex.on{background:var(--accent-soft);border-color:var(--accent)}
.ex-t{font-weight:600;line-height:1.3}
.who{font-size:.85rem;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.demo-band{background:var(--warn-soft);color:var(--warn);font-size:.85rem}
.demo-band .wrap{padding-block:6px}

main{padding-block:20px calc(var(--tab-h) + 32px)}
main.no-tabs{padding-bottom:40px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.mono{font-family:var(--f-mono);font-weight:500}

/* cartes et sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tight{gap:6px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title h2{font-size:1.35rem}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--mark);border-color:var(--mark)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-action{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;min-height:96px;color:var(--ink)}
.big-action.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 22px var(--glow)}
.big-action b{font:800 1.2rem/1.15 var(--f-display)}
.big-action span{font-size:.85rem;opacity:.85}
.big-actions .big-action:not(.primary){background:var(--pop-soft);border-color:transparent}

/* formulaires */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;min-width:0}
label.f .hint{font-weight:400;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=date],input[type=password],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.92rem;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.chip .code{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.comp-list{display:flex;flex-direction:column;gap:6px}
.comp-opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.comp-opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.comp-opt input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.comp-opt .code{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);flex:none;width:2.6em;margin-top:2px}
.radio-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notice{border-left:4px solid var(--mark);background:var(--mark-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}

/* pièces jointes */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.piece{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column;min-width:0}
.piece .thumb{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden}
.piece .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.piece .file-ico{font:600 1.1rem var(--f-mono);color:var(--muted)}
.piece .meta{padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.piece .meta input{min-height:38px;padding:6px 8px;font-size:.88rem}
.piece .name{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-zone{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-zone label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border:2px dashed var(--line);border-radius:var(--r);cursor:pointer;font-weight:600;text-align:center;padding:8px;background:var(--surface)}
.add-zone label:hover{border-color:var(--accent)}
.add-zone input{position:absolute;opacity:0;width:1px;height:1px}
.add-zone small{font-weight:400;color:var(--muted);font-size:.8rem}

/* liste de fiches */
.entry{display:flex;gap:12px;align-items:stretch;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.entry:hover{border-color:var(--accent)}
.entry .ph{width:72px;height:72px;flex:none;border-radius:8px;background:var(--sunk);overflow:hidden;display:flex;align-items:center;justify-content:center;font:600 .8rem var(--f-mono);color:var(--muted)}
.entry .ph img{width:100%;height:100%;object-fit:cover}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.entry .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:500 .72rem/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.act{background:var(--accent-soft);color:var(--accent)}
.tag.journal{background:var(--warn-soft);color:var(--warn)}
.tag.com{background:var(--mark-soft);color:var(--mark)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters .chip{flex:none}

/* bornes de compétences */
.bornes{display:flex;flex-direction:column;gap:12px}
.bloc-head{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.bloc-head b{color:var(--ink)}
.borne-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.borne{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;background:var(--surface);min-width:0}
.borne .c{font:500 .8rem var(--f-mono);color:var(--muted)}
.borne .n{font:600 1.15rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.borne .l{font-size:.72rem;color:var(--muted);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.borne.on{border-color:var(--ok);background:var(--ok-soft)}
.borne.on .c{color:var(--ok)}
.mini-bornes{display:flex;gap:3px;flex-wrap:wrap}
.mini-bornes i{width:14px;height:14px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.mini-bornes i.on{background:var(--ok);border-color:var(--ok)}
.mini-bornes .gap{width:6px;border:0;background:none}

/* détail fiche */
.kv{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:6px 12px}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.block-text{white-space:pre-wrap;overflow-wrap:anywhere}
.figure{display:flex;flex-direction:column;gap:4px}
.figure img{border-radius:8px;width:100%;max-height:70vh;object-fit:contain;background:var(--sunk)}
.figure figcaption{font-size:.9rem;color:var(--muted);font-style:italic}
.comment{border-left:3px solid var(--mark);padding:6px 10px;background:var(--mark-soft);border-radius:0 6px 6px 0}

/* tableau de bord prof */
.students{display:flex;flex-direction:column;gap:8px}
.student{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.student:hover{border-color:var(--accent)}
.student .nm{font-weight:700}
.status{font:500 .75rem/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap;align-self:start}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.none{background:var(--mark-soft);color:var(--mark)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font:800 1.6rem/1.1 var(--f-display);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--sunk);font-weight:600}
td.mono{font-variant-numeric:tabular-nums}

/* rapport */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:14px;font-size:.98rem}
.report h1{font-size:1.8rem}
.report h2{font-size:1.35rem;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-top:10px}
.report h3{font-size:1.1rem;margin-top:6px}
.report .todo{color:var(--mark);font-style:italic}
.report img{max-width:100%;border-radius:4px}

/* calendrier */
.cal{display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h3{text-transform:capitalize}
.cal-nav{display:flex;gap:4px}
.cal-nav .btn{min-width:40px;padding:0 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-height:48px;padding:6px 2px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;font-size:.9rem}
.cal-day:hover{border-color:var(--line)}
.cal-day.out{visibility:hidden}
.cal-day.we{color:var(--muted)}
.cal-day.stage{background:var(--accent-soft)}
.cal-day.miss::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--mark)}
.cal-day.today .n{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px;padding:0 3px}
.cal-day.sel{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day .dots{display:flex;gap:3px;min-height:7px}
.cal-day .dots i{width:7px;height:7px;border-radius:50%}
.dot-f{background:var(--accent)} .dot-n{background:var(--warn)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.cal-legend .sq{width:14px;height:12px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--line)}
.cal-sum{font-size:.85rem;color:var(--muted)}
.cal-detail{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}

/* version ordinateur (enseignant) */
.shell{display:block}
.side{display:none}

function confirmBox(title, text, okLabel="Supprimer"){
  return new Promise(res=>{
    const o=document.createElement("div"); o.className="overlay";
    o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${h(title)}</h2><p>${h(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-r="0">Annuler</button><button class="btn danger" data-r="1">${h(okLabel)}</button></div></div>`;
    o.addEventListener("click",e=>{ const b=e.target.closest("[data-r]"); if(b||e.target===o){ o.remove(); res(b?.dataset.r==="1"); } });
    document.body.appendChild(o); o.querySelector('[data-r="0"]').focus();
  });
}

function confirmTyped(title, text, expected, okLabel="Supprimer définitivement"){
  return new Promise(res=>{
    const o=document.createElement("div"); o.className="overlay";
    o.innerHTML=`<form class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT2"><h2 id="dlgT2">${h(title)}</h2><p>${h(text)}</p>
      <label class="f">Pour confirmer, tapez <span class="mono">${h(expected)}</span><input type="text" id="dlgIn" autocomplete="off" autocapitalize="none"></label>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-r="0">Annuler</button><button type="submit" class="btn danger" id="dlgOk" disabled>${h(okLabel)}</button></div></form>`;
    const close=v=>{ o.remove(); res(v); };
    const inp=o.querySelector("#dlgIn"), ok=o.querySelector("#dlgOk");
    inp.addEventListener("input",()=>{ ok.disabled = inp.value.trim()!==expected; });
    o.querySelector("form").addEventListener("submit",e=>{ e.preventDefault(); if(inp.value.trim()===expected) close(true); });
    o.addEventListener("click",e=>{ if(e.target.closest('[data-r="0"]')||e.target===o) close(false); });
    document.body.appendChild(o); inp.focus();
  });
}

/* Compression des photos : 1600 px max, JPEG */
async function compressImage(file){
  if(!/^image\/(jpeg|png|webp)/.test(file.type)) return file;
  try{
    const bmp = await loadImage(file);
    const max=1600, sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(sc===1 && file.size<900000) return file;
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82));
    if(!blob) return file;
    return new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}
function loadImage(src){
  return new Promise((res,rej)=>{ const url = src instanceof Blob ? URL.createObjectURL(src) : src; const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; });
}

/* Enregistrer un fichier (capacité "downloads" dans Claude, lien classique ailleurs) */
async function saveFile(filename, blob){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data:blob}); toast("Fichier enregistré"); return; }
    }
  }catch(e){
    if(e && e.code==="declined") return;
    if(e && e.code && e.code!=="unavailable" && e.code!=="not_granted"){ toast("Téléchargement impossible ici"); return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

function idb(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open("carnet-pfmp-demo",1);
    rq.onupgradeneeded=()=>{ const db=rq.result; ["profiles","periodes","entries","comments","files","meta"].forEach(s=>db.createObjectStore(s,{keyPath:"id"})); };
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
  });
}
function tx(db,store,mode,fn){ return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const s=t.objectStore(store); const r=fn(s); t.oncomplete=()=>res(r&&"result" in r?r.result:undefined); t.onerror=()=>rej(t.error); }); }

/* Ordre personnalisé : le dernier choix de l'élève passe en tête */
function recentKey(kind){ return `recent-${kind}-${S.me?.id||"x"}`; }
function getRecent(kind){ try{ return JSON.parse(sessionStorageGet(recentKey(kind))||"[]"); }catch(e){ return []; } }
function pushRecent(kind,ids){ const cur=getRecent(kind).filter(x=>!ids.includes(x)); sessionStorageSet(recentKey(kind),JSON.stringify([...ids,...cur].slice(0,40))); }
function orderedExamples(){
  const rec=getRecent("ex");
  // ensuite : activités déjà utilisées dans les fiches de l'élève (les plus récentes d'abord)
  const usedActs=[]; S.entries.filter(e=>e.type==="fiche").forEach(e=>{ if(e.activite && !usedActs.includes(e.activite)) usedActs.push(e.activite); });
  const score=x=>{ const r=rec.indexOf(x.id); if(r>=0) return r; const u=usedActs.indexOf(x.a); return u>=0?100+u:1000; };
  return EXEMPLES.map((x,i)=>({x,i})).sort((p,q)=>score(p.x)-score(q.x)||p.i-q.i).map(p=>p.x);
}
function orderedMateriel(){
  const rec=getRecent("mat"); const cnt={};
  S.entries.forEach(e=>(e.materiel||[]).forEach(m=>cnt[m]=(cnt[m]||0)+1));
  const score=m=>{ const r=rec.indexOf(m); return r>=0?r:100-(cnt[m]||0); };
  return MATERIEL.map((m,i)=>({m,i})).sort((p,q)=>score(p.m)-score(q.m)||p.i-q.i).map(p=>p.m);
}

/* ---------- Jauge « Mon rapport est prêt à X % » (le pôle 3 est un bonus) ---------- */
function fullAnalysis(e){ return !!((e.reussites||e.difficultes) && e.appris && e.taches); }
function reportReadiness(entries, periodes){
  const fiches=entries.filter(e=>e.type==="fiche"); const nF=fiches.length;
  const pole=n=>fiches.filter(e=>actOf(e.activite)?.pole===n).length;
  const cnt=compCounts(fiches); const reqDone=REQ_COMP.filter(c=>cnt[c.c]>0); const reqMiss=REQ_COMP.filter(c=>!cnt[c.c]);
  const photos=entries.flatMap(e=>(e.pieces||[]).filter(isImage)); const capt=photos.filter(p=>(p.legende||"").trim()).length; const nocap=photos.length-capt;
  const full=fiches.filter(fullAnalysis).length;
  const pres=(periodes||[]).some(p=>(p.presentation||"").trim().length>=200);
  const items=[
    {w:15,f:pres?1:0, todo:(periodes||[]).length?"Rédige la présentation de ton entreprise (onglet Mon stage, au moins quelques lignes).":"Ta présentation d'entreprise sera possible dès que ton professeur aura saisi ta PFMP.", ok:"Présentation de l'entreprise rédigée"},
    {w:20,f:Math.min(nF/6,1), todo:`Encore ${plural(Math.max(6-nF,0),"fiche activité","fiches activité")} (objectif : 6).`, ok:"6 fiches activité ou plus"},
    {w:10,f:pole(1)?1:0, todo:"Ajoute une activité du pôle 1 : préparation d'intervention ou mission foncière.", ok:"Une activité du pôle 1"},
    {w:10,f:Math.min(pole(2)/2,1), todo:`Ajoute ${pole(2)?"encore une activité":"deux activités"} du pôle 2 : levé, implantation, géoréférencement, traitement.`, ok:"Deux activités du pôle 2"},
    {w:20,f:reqDone.length/REQ_COMP.length, todo:`Compétences pas encore rencontrées : ${reqMiss.map(c=>c.c).join(", ")}.`, ok:"Les 11 compétences C01 à C11 rencontrées"},
    {w:15,f:nF?full/nF:0, todo:nF?`Complète l'analyse (réussites ou difficultés, ce que tu as appris) de ${plural(nF-full,"fiche","fiches")}.`:"Remplis l'analyse de tes fiches : réussites, difficultés, ce que tu as appris.", ok:"Analyse complète dans toutes les fiches"},
    {w:10,f:nocap?Math.min(capt/5,1)*0.5:Math.min(capt/5,1), todo:nocap?`Ajoute une légende à ${plural(nocap,"photo","photos")}.`:`Ajoute ${plural(Math.max(5-capt,0),"photo légendée","photos légendées")} (objectif : 5).`, ok:"Au moins 5 photos, toutes légendées"}
  ];
  const pct=Math.round(items.reduce((s,i)=>s+i.w*i.f,0));
  const todos=items.filter(i=>i.f<1).sort((a,b)=>b.w*(1-b.f)-a.w*(1-a.f));
  const bonus=pole(3)>0;
  return {pct,todos,done:items.filter(i=>i.f>=1),bonus,reqDone:reqDone.length,cnt,nF,capt,full};
}
function gaugeHTML(entries, periodes, opts={}){
  const r=reportReadiness(entries,periodes); const n=opts.max??3;
  return `<div class="gauge"><div class="gauge-top"><div class="gauge-ring" style="--p:${r.pct}" role="img" aria-label="Rapport prêt à ${r.pct} %"><span>${r.pct}%</span></div>
    <div><h2>${opts.title||"Mon rapport est prêt à "+r.pct+" %"}</h2><p class="small muted">${r.pct>=100?"Tout y est : il reste à rédiger l'introduction et la conclusion.":"Ce qu'il reste à faire en priorité :"}</p></div></div>
    <ul class="todo">${r.todos.slice(0,n).map(t=>`<li>${h(t.todo)}</li>`).join("")}
    <li class="bonus${r.bonus?" done":""}">${r.bonus?"Bonus obtenu : activité de détection de réseaux.":"Bonus, si ton entreprise en fait : une activité de détection de réseaux (pôle 3)."}</li></ul></div>`;
}

/* ---------- Cheminement des compétences (C01 à C11 fermé, C12 à C14 en antenne bonus) ---------- */
const CHEM_PTS={C01:[44,150],C02:[30,98],C03:[58,50],C04:[110,26],C05:[162,40],C06:[212,22],C07:[260,44],C08:[284,98],C09:[262,150],C10:[202,176],C11:[122,178],C12:[322,72],C13:[350,104],C14:[336,148]};
function cheminementHTML(entries){
  const cnt=compCounts(entries.filter(e=>e.type==="fiche")); const on=c=>cnt[c]>0;
  const loop=REQ_COMP.map(c=>c.c); const ant=["C08","C12","C13","C14"];
  const seg=(a,b,bonus)=>{ const [x1,y1]=CHEM_PTS[a],[x2,y2]=CHEM_PTS[b]; return `<line class="seg${on(a)&&on(b)?" on":""}${bonus?" bonus":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; };
  let lines=""; loop.forEach((c,i)=>lines+=seg(c,loop[(i+1)%loop.length]));
  for(let i=0;i<ant.length-1;i++) lines+=seg(ant[i],ant[i+1],true);
  const st=COMPETENCES.map(c=>{ const [x,y]=CHEM_PTS[c.c]; return `<g class="st${on(c.c)?" on":""}${c.bloc===3?" bonus":""}"><title>${h(c.c+" · "+c.l+(c.bloc===3?" (bonus)":"")+" : "+plural(cnt[c.c],"fiche","fiches"))}</title><circle cx="${x}" cy="${y}" r="12"/><text x="${x}" y="${y}">${c.c.slice(1)}</text></g>`; }).join("");
  const n=REQ_COMP.filter(c=>on(c.c)).length; const closed=n===REQ_COMP.length;
  return `<div class="chem"><svg viewBox="0 0 370 205" role="img" aria-label="Cheminement des compétences : ${n} stations sur 11">${lines}${st}
    <text class="center-n" x="160" y="104">${closed?"Fermé !":n+" / 11"}</text><text class="center-l" x="160" y="122">${closed?"toutes les stations C01 à C11":"stations atteintes"}</text></svg>
    <div class="chem-legend"><span><i style="background:var(--accent)"></i>compétence rencontrée</span><span><i style="background:var(--surface);border:2px solid var(--line)"></i>à rencontrer</span><span><i style="background:var(--pop)"></i>antenne bonus (réseaux)</span></div></div>`;
}

  return `<div class="section-title"><h2>Mes badges</h2><span class="small muted">${n} / ${BADGES.filter(b=>!b.bonus).length}${list.find(b=>b.bonus&&b.on)?" + bonus":""}</span></div>
    <div class="badges">${list.map(b=>`<div class="badge${b.on?" on":""}${b.bonus?" bonus":""}" title="${h(b.d)}">${MEDAL}<span class="bl">${h(b.l)}</span><span class="bd">${h(b.d)}</span></div>`).join("")}</div>`;
}
function checkNewBadges(){
  if(!S.me||S.me.role!=="eleve") return;
  const key="badges-"+S.me.id; let seen; try{ seen=JSON.parse(sessionStorageGet(key)||"null"); }catch(e){ seen=null; }
  const on=badgeState(S.entries,S.periodes).filter(b=>b.on);
  if(seen){ const fresh=on.filter(b=>!seen.includes(b.id)); if(fresh.length) setTimeout(()=>toast(`Nouveau badge : ${fresh.map(b=>b.l).join(", ")}`),300); }
  sessionStorageSet(key,JSON.stringify(on.map(b=>b.id)));
}

function seenMap(){ try{ return JSON.parse(sessionStorageGet("seen-"+S.me.id)||"{}"); }catch(e){ return {}; } }
function newCount(entryId){ if(!S.me||S.me.role!=="eleve") return 0; const m=seenMap(); const t=m[entryId]||""; return S.comments.filter(c=>c.entry_id===entryId&&(c.created_at||"")>t).length; }
function markSeen(entryId){ const m=seenMap(); m[entryId]=new Date().toISOString(); sessionStorageSet("seen-"+S.me.id,JSON.stringify(m)); }

const perLabel = p => p ? (p.numero?`PFMP ${p.numero}`:(p.intitule||"PFMP")) : "";
function currentPeriodeOf(list){
  if(!list||!list.length) return null; const t=today();
  return list.find(p=>p.date_debut&&p.date_debut<=t&&(!p.date_fin||p.date_fin>=t))
    || list.filter(p=>p.date_debut&&p.date_debut>t).sort((a,b)=>a.date_debut.localeCompare(b.date_debut))[0]
    || list.slice().sort((a,b)=>(b.date_debut||"").localeCompare(a.date_debut||""))[0];
}

function periodeState(p){
  if(!p.date_debut) return "dates à venir";
  const t0=new Date(p.date_debut+"T00:00"), t1=p.date_fin?new Date(p.date_fin+"T23:59"):null, now=new Date();
  if(now<t0){ const j=Math.ceil((t0-now)/864e5); return `départ dans ${plural(j,"jour","jours")}`; }
  if(t1 && now>t1) return "terminée, place au rapport";
  const sem=Math.floor((now-t0)/(7*864e5))+1; const tot=t1?Math.ceil((t1-t0)/(7*864e5)):null; return `en stage, semaine ${sem}${tot?" sur "+tot:""}`;
}
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function calState(key, periodes){
  S.cal ||= {};
  if(!S.cal[key]){ const p=currentPeriodeOf(periodes); const t=today(); let ym=t.slice(0,7);
    if(p && p.date_debut && t<p.date_debut && p.date_debut.slice(0,7)!==ym && (new Date(p.date_debut)-new Date(t))<40*864e5) ym=p.date_debut.slice(0,7);
    S.cal[key]={ym, sel:null}; }
  return S.cal[key];
}
function calendarHTML(key, entries, periodes){
  const st=calState(key,periodes); const [Y,M]=st.ym.split("-").map(Number);
  const first=new Date(Y,M-1,1), nDays=new Date(Y,M,0).getDate(), lead=(first.getDay()+6)%7, t=today();
  const byDay={}; entries.forEach(e=>{ const d=String(e.date||"").slice(0,10); (byDay[d] ||= []).push(e); });
  const inStage=d=>periodes.some(p=>p.date_debut&&d>=p.date_debut&&(!p.date_fin||d<=p.date_fin));
  let cells=""; for(let i=0;i<lead;i++) cells+=`<span class="cal-day out" aria-hidden="true"></span>`;
  let nF=0,nN=0,nStage=0,nMiss=0;
  for(let d=1; d<=nDays; d++){
    const ds=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`; const dow=(lead+d-1)%7; const we=dow>=5;
    const list=byDay[ds]||[]; const f=list.filter(e=>e.type==="fiche").length, n=list.length-f; nF+=f; nN+=n;
    const stage=inStage(ds)&&!we; if(stage) nStage++; const miss=stage&&ds<t&&!list.length; if(miss) nMiss++;
    const lab=`${d} ${MOIS[M-1]}${f?`, ${plural(f,"fiche","fiches")}`:""}${n?`, ${plural(n,"note","notes")}`:""}${stage?", jour de stage":""}${miss?", sans dépôt":""}`;
    cells+=`<button type="button" class="cal-day${we?" we":""}${stage?" stage":""}${miss?" miss":""}${ds===t?" today":""}${ds===st.sel?" sel":""}" data-calday="${ds}" data-calkey="${key}" aria-label="${h(lab)}"${ds===st.sel?' aria-pressed="true"':""}>
      <span class="n">${d}</span><span class="dots">${f?'<i class="dot-f"></i>':""}${f>1?'<i class="dot-f"></i>':""}${n?'<i class="dot-n"></i>':""}</span></button>`;
  }
  const selList = st.sel ? (byDay[st.sel]||[]) : null;
  return `<div class="cal">
    <div class="cal-head"><h3>${MOIS[M-1]} ${Y}</h3><div class="cal-nav">
      <button type="button" class="btn small" data-calnav="-1" data-calkey="${key}" aria-label="Mois précédent">‹</button>
      <button type="button" class="btn small" data-calnav="0" data-calkey="${key}">Aujourd'hui</button>
      <button type="button" class="btn small" data-calnav="1" data-calkey="${key}" aria-label="Mois suivant">›</button></div></div>
    <div class="cal-grid">${["Lu","Ma","Me","Je","Ve","Sa","Di"].map(x=>`<span class="cal-dow">${x}</span>`).join("")}${cells}</div>
    <div class="cal-legend"><span><i class="dot-f"></i>fiche activité</span><span><i class="dot-n"></i>note de journal</span><span><i class="sq"></i>jour de stage</span><span><i style="background:var(--mark);width:6px;height:6px"></i>stage sans dépôt</span></div>
    <p class="cal-sum">${MOIS[M-1][0].toUpperCase()+MOIS[M-1].slice(1)} : ${plural(nF,"fiche","fiches")}, ${plural(nN,"note","notes")}${nStage?` · ${plural(nStage,"jour de stage","jours de stage")}${nMiss?`, dont ${nMiss} sans dépôt`:""}`:""}</p>
    ${selList?`<div class="cal-detail"><b>${fmtDate(st.sel)}</b>${selList.length?selList.map(entryCard).join(""):`<p class="small muted">Aucune fiche ni note ce jour-là.</p>`}</div>`:""}
  </div>`;
}

function applyExample(x){
  const tf=$("#fTitre"); const prev=exOf(S.draft.entry.exemple);
  if(!tf.value.trim() || (prev && tf.value.trim()===prev.t)) tf.value=x.t;
  $("#fAct").value=x.a; const a=actOf(x.a); $("#actAide").textContent=a?a.aide:"";
  document.querySelectorAll('input[name=comp]').forEach(i=>{ i.checked = x.c.includes(i.value) || (i.checked && !(prev && prev.c.includes(i.value))); });
  document.querySelectorAll('input[name=mat]').forEach(i=>{ if(x.m.includes(i.value)) i.checked=true; });
  S.draft.entry.exemple=x.id; pushRecent("ex",[x.id]);
  $("#exBox").innerHTML=exemplesHTML(x.id,false);
  toast("Exemple appliqué : complétez la fiche");
}
afterRender.fiche = ()=>{
  bindPieces();
  $("#exBox").addEventListener("click",ev=>{ const b=ev.target.closest("[data-ex]"); if(!b) return; const x=exOf(b.dataset.ex); if(x) applyExample(x); });
  $("#fAct").addEventListener("change",ev=>{
    const a=actOf(ev.target.value); $("#actAide").textContent=a?a.aide:"";
    if(a) document.querySelectorAll('input[name=comp]').forEach(i=>{ if(a.comp.includes(i.value)) i.checked=true; });
  });
  $("#ficheForm").addEventListener("submit",ev=>{ ev.preventDefault(); collectFiche(); if(S.draft.entry.materiel.length) pushRecent("mat",S.draft.entry.materiel); delete S.draft.entry.exemple; saveDraft(); });
};
function collectFiche(){
  const e=S.draft.entry;
  e.titre=$("#fTitre").value.trim(); e.date=$("#fDate").value||today(); e.lieu=$("#fLieu").value.trim();
  e.periode_id=$("#fPer")? ($("#fPer").value||null) : e.periode_id;
  e.activite=$("#fAct").value; e.operation=$("#fOp").value.trim(); e.taches=$("#fTaches").value.trim();
  e.materiel=[...document.querySelectorAll('input[name=mat]:checked')].map(i=>i.value); e.materiel_autre=$("#fMatAutre").value.trim();
  e.securite=$("#fSecu").value.trim(); e.competences=[...document.querySelectorAll('input[name=comp]:checked')].map(i=>i.value);
  e.autonomie=(document.querySelector('input[name=auto]:checked')||{}).value||"";
  e.reussites=$("#fReu").value.trim(); e.difficultes=$("#fDif").value.trim(); e.appris=$("#fApp").value.trim();
}
function viewJournalForm(){
  if(!S.draft || S.draft.entry.type!=="journal") startDraft("journal");
  const e=S.draft.entry;
  return `<form class="stack" id="journalForm" novalidate>
    <div class="row between"><h1>${e.id?"Modifier la note":"Note rapide"}</h1><button class="btn small ghost" type="button" data-cancel>Annuler</button></div>
    <div class="card">
      <div class="grid2"><label class="f">Date<input type="date" id="jDate" value="${h(e.date)}"></label><label class="f">Lieu<input type="text" id="jLieu" value="${h(e.lieu)}"></label></div>
      ${periodeSelect(e.periode_id)}
      <label class="f">Ma journée en quelques lignes<span class="hint">Où, avec qui, quoi, quel matériel, une chose apprise.</span><textarea id="jTxt" rows="6">${h(e.contenu)}</textarea></label>
    </div>
    <div class="card"><h3>Photos et fichiers</h3><div id="piecesBox">${piecesEditor()}</div></div>
    <div id="saveProg" hidden class="stack" style="gap:6px"><span class="small muted" id="saveTxt">Envoi…</span><div class="progress"><i id="saveBar"></i></div></div>
    <button class="btn primary block" type="submit" id="saveBtn">Enregistrer la note</button>
  </form>`;
}
afterRender.journal = ()=>{
  bindPieces();
  $("#journalForm").addEventListener("submit",ev=>{ ev.preventDefault(); const e=S.draft.entry;
    e.date=$("#jDate").value||today(); e.lieu=$("#jLieu").value.trim(); e.periode_id=$("#fPer")?($("#fPer").value||null):e.periode_id; e.contenu=$("#jTxt").value.trim();
    e.titre=e.titre||("Journal du "+fmtDate(e.date)); saveDraft(); });
};
function bindPieces(){
  const box=$("#piecesBox");
  const add=async files=>{
    for(const f of files){ const c=await compressImage(f); S.draft.newFiles.push({key:"n"+uid(),file:c,legende:"",url:isImage({type:c.type,nom:c.name})?URL.createObjectURL(c):null}); }
    keepLegends(); box.innerHTML=piecesEditor(); hydrateThumbs(box); rebindPieceInputs();
  };
  const rebindPieceInputs=()=>{
    $("#addPhoto").addEventListener("change",ev=>{ add([...ev.target.files]); });
    $("#addFile").addEventListener("change",ev=>{ add([...ev.target.files]); });
  };
  box.addEventListener("input",ev=>{ const k=ev.target.dataset.leg; if(!k) return; setLegend(k,ev.target.value); });
  box.addEventListener("click",ev=>{ const k=ev.target.closest("[data-rm]")?.dataset.rm; if(!k) return;
    if(k[0]==="o"){ const i=+k.slice(1); const p=S.draft.entry.pieces.splice(i,1)[0]; (S.draft.removed ||= []).push(p.path); }
    else S.draft.newFiles=S.draft.newFiles.filter(n=>n.key!==k);
    box.innerHTML=piecesEditor(); hydrateThumbs(box); rebindPieceInputs(); });
  rebindPieceInputs();
}
function setLegend(k,v){ if(k[0]==="o") S.draft.entry.pieces[+k.slice(1)].legende=v; else { const n=S.draft.newFiles.find(x=>x.key===k); if(n) n.legende=v; } }
function keepLegends(){ document.querySelectorAll("[data-leg]").forEach(i=>setLegend(i.dataset.leg,i.value)); }

async function saveDraft(){
  const d=S.draft, e=d.entry;
  if(e.type==="fiche" && !e.titre){ toast("Donnez un titre à la fiche"); $("#fTitre").focus(); return; }
  if(e.type==="journal" && !e.contenu && !d.newFiles.length && !e.pieces.length){ toast("Écrivez quelques lignes ou ajoutez une photo"); return; }
  const btn=$("#saveBtn"); btn.disabled=true; const prog=$("#saveProg"); prog.hidden=false;
  try{
    const total=d.newFiles.length; let i=0;
    for(const n of d.newFiles){
      $("#saveTxt").textContent=`Envoi des fichiers : ${i+1} / ${total}`; $("#saveBar").style.width=Math.round(i/Math.max(total,1)*100)+"%";
      const path=await Store.uploadFile(S.me.id,n.file);
      e.pieces.push({path,legende:n.legende,nom:n.file.name,type:n.file.type,taille:n.file.size}); i++;
    }
    d.newFiles=[]; $("#saveTxt").textContent="Enregistrement…"; $("#saveBar").style.width="100%";
    const saved=await Store.saveEntry(e);
    for(const p of d.removed||[]) try{ await Store.deleteFile(p); }catch(x){}
    S.draft=null; await refresh(); toast(e.type==="fiche"?"Fiche enregistrée":"Note enregistrée"); go("entry",{id:saved.id});
  }catch(x){ toast(x.message||"Enregistrement impossible"); btn.disabled=false; prog.hidden=true; }
}

/* =====================================================================

function entryCard(e){
  const ph=(e.pieces||[]).find(isImage); const a=actOf(e.activite); const nc=S.comments.filter(c=>c.entry_id===e.id).length; const nn=newCount(e.id);
  return `<button class="entry" data-open="${e.id}">
    <span class="ph" ${ph?`data-thumb="${h(ph.path)}"`:""}>${ph?"":e.type==="journal"?"NOTE":"FICHE"}</span>
    <span class="body"><span class="small muted">${fmtDate(e.date)}${e.lieu?" · "+h(e.lieu):""}</span><span class="t">${h(e.titre||"Sans titre")}</span>
    <span class="tags">${e.type==="journal"?'<span class="tag journal">Journal</span>':""}${a&&a.a!=="AUT"?`<span class="tag act">${a.a}</span>`:""}${(e.competences||[]).map(c=>`<span class="tag">${c}</span>`).join("")}${(e.pieces||[]).length?`<span class="tag">${e.pieces.length} pièce${e.pieces.length>1?"s":""}</span>`:""}${nn?`<span class="tag new">${plural(nn,"nouveau retour","nouveaux retours")}</span>`:nc?`<span class="tag com">${plural(nc,"retour","retours")}</span>`:""}</span></span>
  </button>`;
}
function viewDossier(){
  const f=S.filter; let list=S.entries;
  if(f==="journal") list=list.filter(e=>e.type==="journal"); else if(f!=="all") list=list.filter(e=>actOf(e.activite)?.pole===+f && e.type==="fiche");
  const opt=(v,l)=>`<label class="chip"><input type="radio" name="flt" value="${v}"${f===v?" checked":""}>${l}</label>`;
  return `<div class="stack">
    <div class="row between"><h1>Mon dossier</h1><button class="btn small primary" data-go="report">Mon rapport</button></div>
    <div class="filters" role="radiogroup" aria-label="Filtrer">${opt("all","Tout")}${opt("1","Pôle 1 · Foncier")}${opt("2","Pôle 2 · Topo")}${opt("3","Pôle 3 · Réseaux")}${opt("journal","Journal")}</div>
    ${list.length?`<div class="stack" style="gap:8px">${list.map(entryCard).join("")}</div>`:`<div class="card"><p>Rien ici pour l'instant.</p><button class="btn primary" data-go="fiche">Créer une fiche activité</button></div>`}
  </div>`;
}
afterRender.dossier=()=>{ document.querySelectorAll('input[name=flt]').forEach(i=>i.addEventListener("change",()=>{ S.filter=i.value; render(); })); };

function findEntry(id){ return (S.me.role==="eleve"?S.entries:S.allEntries).find(e=>e.id===id); }
function viewEntry(){
  const e=findEntry(S.p.id); if(!e) return `<p>Fiche introuvable.</p>`;
  const a=actOf(e.activite); const mine=S.me.role==="eleve"; const coms=S.comments.filter(c=>c.entry_id===e.id);
  const per=(mine?S.periodes:S.allPeriodes).find(p=>p.id===e.periode_id);
  const kv=(k,v)=>v?`<dt>${k}</dt><dd>${h(v)}</dd>`:"";
  const imgs=(e.pieces||[]).filter(isImage), files=(e.pieces||[]).filter(p=>!isImage(p));
  return `<div class="stack">
    <div class="row between"><button class="btn small ghost" data-back>← Retour</button>${mine?`<div class="row"><button class="btn small" data-edit="${e.id}">Modifier</button><button class="btn small danger" data-del="${e.id}">Supprimer</button></div>`:""}</div>
    <div><span class="eyebrow">${e.type==="journal"?"Note de journal":(a?a.a+" · "+h(a.l):"Fiche activité")}</span><h1>${h(e.titre||"Sans titre")}</h1>
    <p class="muted">${fmtDate(e.date)}${e.lieu?" · "+h(e.lieu):""}${per?" · "+h(perLabel(per))+(per.entreprise?", "+h(per.entreprise):""):""}</p></div>
    <div class="split-entry"><div class="a-text">
    ${e.type==="journal"?`<div class="card"><p class="block-text">${h(e.contenu)||'<span class="muted">Pas de texte.</span>'}</p>${mine?`<button class="btn small" data-tofiche="${e.id}">Transformer en fiche activité</button>`:""}</div>`:`
    <div class="card"><dl class="kv">${kv("Contexte",e.operation)}${kv("Tâches réalisées",e.taches)}${kv("Matériel",[...(e.materiel||[]),e.materiel_autre].filter(Boolean).join(", "))}${kv("Sécurité, environnement",e.securite)}${kv("Autonomie",(AUTONOMIE.find(x=>x[0]===e.autonomie)||[])[1])}${kv("Réussites",e.reussites)}${kv("Aléas, difficultés",e.difficultes)}${kv("Ce que j'ai appris",e.appris)}</dl>
    ${(e.competences||[]).length?`<div class="tags">${e.competences.map(c=>`<span class="tag act" title="${h(compOf(c)?.l)}">${c} ${h(compOf(c)?.l||"")}</span>`).join("")}</div>`:""}</div>`}
    </div>
    ${imgs.length?`<div class="stack a-imgs">${imgs.map(p=>`<figure class="figure" style="margin:0"><div data-thumb="${h(p.path)}" data-alt="${h(p.legende)}"></div>${p.legende?`<figcaption>${h(p.legende)}</figcaption>`:""}</figure>`).join("")}</div>`:""}
    ${files.length?`<div class="card tight a-files"><h3>Fichiers joints</h3>${files.map(p=>`<div class="row between"><span style="min-width:0;overflow-wrap:anywhere">${h(p.nom)} <span class="small muted">${fmtSize(p.taille)}${p.legende?" · "+h(p.legende):""}</span></span><button class="btn small" data-dlfile="${h(p.path)}" data-name="${h(p.nom)}">Télécharger</button></div>`).join("")}</div>`:""}
    <div class="card a-coms"><h3>Retours du professeur et du tuteur</h3>
      ${coms.length?coms.map(c=>commentHTML(c,!mine)).join(""):`<p class="small muted">Aucun retour pour l'instant.</p>`}
      ${!mine?`<div class="stack" style="gap:6px"><span class="small muted">Réagir en un geste</span><div class="reacts">${Object.entries(REACTIONS).map(([k,l])=>`<button type="button" class="rx-btn" data-react="${k}">${l}</button>`).join("")}</div></div>`:""}
      ${!mine?`<form id="comForm" class="stack" style="gap:8px"><label class="f">Ajouter un commentaire<textarea id="comTxt" rows="3" placeholder="Conseil, question, point à développer dans le rapport…"></textarea></label><button class="btn primary" type="submit">Publier le commentaire</button></form>`:""}
    </div></div>
  </div>`;
}

const NB_PFMP = 5;
function viewPeriodes(){
  const classes=[...new Set(S.students.map(s=>s.classe).filter(Boolean))].sort();
  const cls = S.pf.classe ?? (S.classe||classes[0]||""); const num=S.pf.numero||1;
  const list=S.students.filter(s=>!cls||s.classe===cls);
  const ex=s=>S.allPeriodes.find(p=>p.eleve_id===s.id&&p.numero===num);
  const ref=list.map(ex).find(p=>p&&p.date_debut)||{};
  const done=list.filter(ex).length;
  const v=(s,k)=>h((ex(s)||{})[k]||"");
  return `<div class="stack">
    <div class="row between"><button class="btn small ghost" data-go="home">← Classe</button></div>

    <div class="card">
      <div class="grid2"><label class="f">Classe<select id="pfCls">${classes.length?"":`<option value="">Toutes</option>`}${classes.map(c=>`<option${c===cls?" selected":""}>${h(c)}</option>`).join("")}</select></label>

      <button class="btn" type="button" id="pfApply">Appliquer ces dates à tous les élèves</button>
      <p class="small muted">${done} / ${list.length} élèves renseignés pour la PFMP ${num}.</p>
    </div>
    ${list.length&&isDesk()?`<form id="pfForm" class="stack" novalidate><div class="table-wrap"><table class="form-table"><thead><tr><th>Élève</th><th>Entreprise</th><th>Commune</th><th>Tuteur</th><th>Fonction</th><th>Début</th><th>Fin</th><th></th></tr></thead><tbody>
      ${list.map(s=>{ const e=ex(s); const k=s.id; return `<tr class="pf-row" data-sid="${k}"><td><b>${h(s.nom)}</b> ${h(s.prenom)}</td>
        <td><input type="text" id="pf-${k}-entreprise" value="${v(s,"entreprise")}" aria-label="Entreprise de ${h(s.prenom)}"></td>
        <td><input type="text" id="pf-${k}-ville" value="${v(s,"ville")}" aria-label="Commune"></td>
        <td><input type="text" id="pf-${k}-tuteur" value="${v(s,"tuteur")}" aria-label="Tuteur"></td>

        <td><input type="date" class="pf-deb" id="pf-${k}-date_debut" value="${v(s,"date_debut")}" aria-label="Début"></td>
        <td><input type="date" class="pf-fin" id="pf-${k}-date_fin" value="${v(s,"date_fin")}" aria-label="Fin"></td>
        <td>${e?`<button type="button" class="btn small ghost" data-delperprof="${e.id}">Retirer</button>`:`<span class="status none">à saisir</span>`}</td></tr>`; }).join("")}
      </tbody></table></div><div class="row"><button class="btn primary" type="submit" id="pfSave">Enregistrer la PFMP ${num}</button></div></form>`
    :list.length?`<form id="pfForm" class="stack" novalidate>
      ${list.map(s=>{ const e=ex(s); const k=s.id; return `<div class="card pf-row" data-sid="${k}">
        <div class="row between"><b>${h(s.nom)} ${h(s.prenom)}</b>${e?`<span class="row" style="gap:6px"><span class="status ok">enregistrée</span><button type="button" class="btn small ghost" data-delperprof="${e.id}">Retirer</button></span>`:`<span class="status none">à saisir</span>`}</div>
        <div class="grid2"><label class="f">Entreprise<input type="text" id="pf-${k}-entreprise" value="${v(s,"entreprise")}"></label><label class="f">Commune<input type="text" id="pf-${k}-ville" value="${v(s,"ville")}"></label></div>
        <div class="grid2"><label class="f">Tuteur<input type="text" id="pf-${k}-tuteur" value="${v(s,"tuteur")}" placeholder="M. ou Mme Nom"></label><label class="f">Fonction du tuteur<input type="text" id="pf-${k}-tuteur_fonction" value="${v(s,"tuteur_fonction")}" placeholder="ex. Géomètre-expert"></label></div>

afterRender.periodes=()=>{
  $("#pfCls")?.addEventListener("change",ev=>{ S.pf={...S.pf,classe:ev.target.value}; render(); });
  $("#pfNum").addEventListener("change",ev=>{ S.pf={...S.pf,numero:+ev.target.value}; render(); });
  $("#pfApply").addEventListener("click",()=>{ const d=$("#pfDeb").value, f=$("#pfFin").value; if(!d&&!f){ toast("Indiquez d'abord les dates"); return; }
    document.querySelectorAll(".pf-deb").forEach(i=>{ if(d) i.value=d; }); document.querySelectorAll(".pf-fin").forEach(i=>{ if(f) i.value=f; }); toast("Dates appliquées : pensez à enregistrer"); });
  $("#pfForm")?.addEventListener("submit",async ev=>{ ev.preventDefault();
    const num=S.pf.numero||1; const btn=$("#pfSave"); btn.disabled=true; let n=0;
    try{
      for(const row of document.querySelectorAll(".pf-row")){
        const sid=row.dataset.sid; const g=k=>$(`#pf-${sid}-${k}`).value.trim();
        const vals={entreprise:g("entreprise"),ville:g("ville"),tuteur:g("tuteur"),tuteur_fonction:g("tuteur_fonction"),date_debut:g("date_debut")||null,date_fin:g("date_fin")||null};
        const old=S.allPeriodes.find(p=>p.eleve_id===sid&&p.numero===num);
        if(!old && !vals.entreprise && !vals.tuteur && !vals.date_debut) continue;
        if(old && ["entreprise","ville","tuteur","tuteur_fonction","date_debut","date_fin"].every(k=>(old[k]||null)===(vals[k]||null))) continue;
        await Store.savePeriode({...(old||{}),eleve_id:sid,numero:num,intitule:`PFMP ${num}`,...vals}); n++;
      }
      await refresh(); toast(n?plural(n,"période enregistrée","périodes enregistrées"):"Aucune modification"); render();
    }catch(x){ toast(x.message); btn.disabled=false; }
  });
};

/* =====================================================================
   RAPPORT (aperçu + export Word)
   ===================================================================== */
function reportModel(eleve, periodes, entries, perId){
  const per = perId ? periodes.find(p=>p.id===perId) : null;
  const ents = (perId ? entries.filter(e=>e.periode_id===perId) : entries).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const fiches=ents.filter(e=>e.type==="fiche"), journal=ents.filter(e=>e.type==="journal");
  const B=[]; const P=(t,o={})=>B.push({k:"p",t,...o});
  B.push({k:"title",t:"Rapport de PFMP"});
  P(`${eleve.prenom} ${eleve.nom}${eleve.classe?" — "+eleve.classe:""}`,{b:true});
  P(`${CONFIG.DIPLOME} — ${CONFIG.LYCEE}`);
  const pers = per?[per]:periodes;
  pers.forEach(p=>P(`${perLabel(p)} : ${p.entreprise||"[entreprise]"}${p.ville?", "+p.ville:""}${p.date_debut?` — du ${fmtDate(p.date_debut)} au ${fmtDate(p.date_fin)}`:""}${p.tuteur?` — tuteur : ${p.tuteur}${p.tuteur_fonction?" ("+p.tuteur_fonction+")":""}`:""}`));
  B.push({k:"h1",t:"1. Présentation de l'entreprise"});
  if(!pers.length) P("[À compléter : nom, activité, clients, organisation, matériel.]",{todo:true});
  pers.forEach(p=>{ if(pers.length>1) B.push({k:"h2",t:`${perLabel(p)} · ${p.entreprise||""}`});
    const facts=[p.secteur&&`Secteur : ${p.secteur}`,p.effectif&&`Effectif : ${p.effectif}`,p.ville&&`Ville : ${p.ville}`].filter(Boolean);
    if(facts.length) P(facts.join(" · "));
    if(p.presentation) p.presentation.split(/\n+/).forEach(l=>P(l)); else P("[À compléter : activités principales, clients, organisation de l'équipe, matériel et logiciels, ma place dans l'entreprise.]",{todo:true}); });
  B.push({k:"h1",t:"2. Mes activités"});
  if(!fiches.length) P("[Aucune fiche activité pour l'instant.]",{todo:true});
  let n=0;
  [1,2,3,0].forEach(pl=>{ const list=fiches.filter(e=>(actOf(e.activite)?.pole??0)===pl); if(!list.length) return;
    B.push({k:"h2",t:POLES[pl]});
    list.forEach(e=>{ n++; const a=actOf(e.activite);
      B.push({k:"h3",t:`2.${n} ${e.titre||"Activité"}`});
      P(`${fmtDate(e.date)}${e.lieu?" — "+e.lieu:""}${a&&a.a!=="AUT"?` — Activité ${a.a} : ${a.l}`:""}`,{i:true});
      const line=(lab,v)=>{ if(v) B.push({k:"p",lab,t:v}); };
      line("Contexte",e.operation); line("Ce que j'ai fait",e.taches);
      line("Matériel et logiciels",[...(e.materiel||[]),e.materiel_autre].filter(Boolean).join(", "));
      line("Sécurité et environnement",e.securite);
      line("Mon autonomie",(AUTONOMIE.find(x=>x[0]===e.autonomie)||[])[1]);
      line("Ce qui a bien marché",e.reussites); line("Aléas et difficultés",e.difficultes); line("Ce que j'ai appris",e.appris);
      if((e.competences||[]).length) line("Compétences mobilisées",e.competences.map(c=>`${c} ${compOf(c)?.l||""}`).join(" ; "));
      (e.pieces||[]).forEach(p=>{ if(isImage(p)) B.push({k:"img",path:p.path,cap:p.legende||""}); else B.push({k:"p",t:`Pièce jointe : ${p.nom}${p.legende?" — "+p.legende:""}`,i:true}); });
    }); });
  if(journal.length){ B.push({k:"h1",t:"3. Journal de bord"});
    journal.forEach(e=>{ B.push({k:"h3",t:`${fmtDate(e.date)}${e.lieu?" — "+e.lieu:""}`}); (e.contenu||"").split(/\n+/).filter(Boolean).forEach(l=>P(l));
      (e.pieces||[]).filter(isImage).forEach(p=>B.push({k:"img",path:p.path,cap:p.legende||""})); }); }
  B.push({k:"h1",t:`${journal.length?4:3}. Bilan des compétences`});
  const cnt=compCounts(fiches);
  [1,2,3].forEach(b=>{ B.push({k:"h3",t:`${BLOCS[b].t} (${BLOCS[b].u})`}); COMPETENCES.filter(c=>c.bloc===b).forEach(c=>P(`${c.c} — ${c.l} : ${cnt[c.c]?plural(cnt[c.c],"activité","activités"):"non rencontrée pendant la PFMP"}`)); });
  B.push({k:"h1",t:`${journal.length?5:4}. Conclusion`});
  P("[À rédiger : ce que cette PFMP m'a apporté, ce que je veux encore apprendre, mon projet professionnel.]",{todo:true});
  return {blocks:B, eleve, per, nFiches:fiches.length, nJournal:journal.length};
}
function reportContext(){
  if(S.me.role==="eleve") return {eleve:S.me,periodes:S.periodes,entries:S.entries};
  const eleve=S.students.find(s=>s.id===S.p.eleve); return {eleve,periodes:S.allPeriodes.filter(p=>p.eleve_id===eleve?.id),entries:S.allEntries.filter(e=>e.eleve_id===eleve?.id)};
}
function viewReport(){
  const ctx=reportContext(); if(!ctx.eleve) return "<p>Élève introuvable.</p>";
  const perId=S.p.per||"";
  const m=reportModel(ctx.eleve,ctx.periodes,ctx.entries,perId||null);
  const body=m.blocks.map(b=>{ switch(b.k){
    case "title": return `<h1>${h(b.t)}</h1>`;
    case "h1": return `<h2>${h(b.t)}</h2>`;
    case "h2": return `<h3 style="font-size:1.2rem">${h(b.t)}</h3>`;
    case "h3": return `<h3>${h(b.t)}</h3>`;
    case "img": return `<figure class="figure" style="margin:0"><div data-thumb="${h(b.path)}"></div>${b.cap?`<figcaption>${h(b.cap)}</figcaption>`:""}</figure>`;
    default: return `<p class="${b.todo?"todo":""}" style="${b.i?"font-style:italic":""}${b.b?";font-weight:700":""}">${b.lab?`<b>${h(b.lab)} : </b>`:""}${h(b.t)}</p>`; } }).join("");
  return `<div class="stack">
    <div class="row between"><button class="btn small ghost" data-back>← Retour</button></div>
    <div><span class="eyebrow">Trame à finir dans Word</span><h1>${S.me.role==="eleve"?"Mon rapport de stage":"Rapport de "+h(ctx.eleve.prenom+" "+ctx.eleve.nom)}</h1>
    <p class="muted">Vos fiches et photos rangées par pôle d'activité. Téléchargez le fichier Word, puis rédigez les parties en orange.</p></div>
    ${ctx.periodes.length>1?`<label class="f">Période<select id="repPer"><option value="">Toutes les périodes</option>${ctx.periodes.map(p=>`<option value="${p.id}"${p.id===perId?" selected":""}>${h(perLabel(p))}${p.entreprise?" · "+h(p.entreprise):""}</option>`).join("")}</select></label>`:""}
    <div class="card">${gaugeHTML(ctx.entries,ctx.periodes,{max:7,title:(S.me.role==="eleve"?"Mon rapport est prêt à ":"Rapport prêt à ")+reportReadiness(ctx.entries,ctx.periodes).pct+" %"})}</div>
    <div class="row"><button class="btn primary" id="dlDocx">Télécharger en Word (.docx)</button><span class="small muted">${plural(m.nFiches,"fiche","fiches")} · ${plural(m.nJournal,"note","notes")}</span></div>
    <div id="dlProg" hidden class="small muted"></div>
    <article class="report">${body}</article>
  </div>`;
}
afterRender.report=()=>{
  $("#repPer")?.addEventListener("change",ev=>{ S.p={...S.p,per:ev.target.value}; render(); });
  $("#dlDocx").addEventListener("click",async ev=>{
    const btn=ev.currentTarget; btn.disabled=true; const pr=$("#dlProg"); pr.hidden=false; pr.textContent="Préparation du fichier…";
    try{ const ctx=reportContext(); const m=reportModel(ctx.eleve,ctx.periodes,ctx.entries,S.p.per||null);
      const blob=await buildDocx(m,(i,n)=>pr.textContent=`Ajout des photos : ${i} / ${n}`);
      await saveFile(`Rapport_PFMP_${norm(ctx.eleve.nom)}_${norm(ctx.eleve.prenom)}.docx`,blob); pr.hidden=true;
    }catch(x){ pr.textContent="Création du fichier impossible : "+(x.message||x); } finally{ btn.disabled=false; } });
};

/* Générateur .docx minimal (JSZip) */
const xe = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function wRun(t,o={}){ return `<w:r><w:rPr>${o.b?"<w:b/>":""}${o.i?"<w:i/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}</w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`; }
function wPara(runs,style,extra=""){ return `<w:p><w:pPr>${style?`<w:pStyle w:val="${style}"/>`:""}${extra}</w:pPr>${runs}</w:p>`; }
async function toJpeg(blob){
  const im=await loadImage(blob); const cv=document.createElement("canvas"); const sc=Math.min(1,1600/Math.max(im.width,im.height));
  cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc); const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height); g.drawImage(im,0,0,cv.width,cv.height);
  const out=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)); return {data:await out.arrayBuffer(),w:cv.width,h:cv.height};
}
async function buildDocx(model,onProg){
  if(typeof JSZip==="undefined") throw new Error("bibliothèque de création Word non chargée");
  const zip=new JSZip(); const rels=[]; let body=""; let imgN=0; const imgs=model.blocks.filter(b=>b.k==="img"); let done=0;
  for(const b of model.blocks){
    if(b.k==="title") body+=wPara(wRun(b.t),"Title");
    else if(b.k==="h1") body+=wPara(wRun(b.t),"Heading1");
    else if(b.k==="h2") body+=wPara(wRun(b.t),"Heading2");
    else if(b.k==="h3") body+=wPara(wRun(b.t),"Heading3");
    else if(b.k==="img"){
      onProg?.(++done,imgs.length);
      try{ const blob=await Store.fileBlob(b.path); if(!blob) continue; const j=await toJpeg(blob); imgN++;
        const name=`img${imgN}.jpeg`; zip.file(`word/media/${name}`,j.data); const rid=`rIdImg${imgN}`;
        rels.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${name}"/>`);
        const maxW=5760000,maxH=4320000; let cx=maxW, cy=Math.round(maxW*j.h/j.w); if(cy>maxH){ cy=maxH; cx=Math.round(maxH*j.w/j.h); }
        body+=`<w:p><w:pPr><w:jc w:val="center"/><w:keepNext/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${imgN}" name="Photo ${imgN}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${imgN}" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
        body+=wPara(wRun(`Photo ${imgN}${b.cap?" — "+b.cap:""}`),"Caption");
      }catch(x){ /* image illisible : ignorée */ }
    } else {
      const runs=(b.lab?wRun(b.lab+" : ",{b:true}):"")+wRun(b.t,{i:b.i||b.todo,b:b.b,color:b.todo?"C8460E":null});
      body+=wPara(runs,null);
    }
  }
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="240"/></w:pPr><w:rPr><w:b/><w:color w:val="163E73"/><w:sz w:val="52"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="360" w:after="120"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:color w:val="163E73"/><w:sz w:val="32"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="80"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:sz w:val="28"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="60"/><w:outlineLvl w:val="2"/></w:pPr><w:rPr><w:b/><w:color w:val="333333"/><w:sz w:val="24"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Caption"><w:name w:val="caption"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/></w:pPr><w:rPr><w:i/><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr></w:style></w:styles>`;
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${rels.join("")}</Relationships>`);
  zip.file("word/document.xml",doc); zip.file("word/styles.xml",styles);
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* =====================================================================

function studentStats(s){
  const ents=S.allEntries.filter(e=>e.eleve_id===s.id); const fiches=ents.filter(e=>e.type==="fiche");
  const last=ents.reduce((m,e)=>{ const t=e.created_at||e.date; return !m||t>m?t:m; },null);
  const per=currentPeriodeOf(S.allPeriodes.filter(p=>p.eleve_id===s.id));
  const pers=S.allPeriodes.filter(p=>p.eleve_id===s.id);
  return {ents,fiches,last,per,cnt:compCounts(fiches),photos:ents.reduce((n,e)=>n+(e.pieces||[]).filter(isImage).length,0),pct:reportReadiness(ents,pers).pct};
}
function miniBornes(cnt){ return `<span class="mini-bornes" aria-label="Compétences couvertes">${COMPETENCES.map((c,i)=>`${i===5||i===11?'<i class="gap"></i>':""}<i class="${cnt[c.c]?"on":""}" title="${c.c} : ${cnt[c.c]}"></i>`).join("")}</span>`; }
function dashTable(rows){
  return `<div class="table-wrap"><table class="grid-table"><thead><tr><th>Élève</th><th>Classe</th><th>PFMP en cours</th><th>Entreprise</th><th>Tuteur</th><th class="num">Fiches</th><th class="num">Notes</th><th class="num">Photos</th><th>Dernier dépôt</th><th class="num">Rapport</th><th>Compétences C01 → C14</th></tr></thead><tbody>
  ${rows.map(({s,st})=>{ const d=daysSince(st.last); const cls=d===null?"none":d>7?"warn":"ok"; const lab=d===null?"aucun dépôt":d===0?"aujourd'hui":`il y a ${d} j`;
    return `<tr data-student="${s.id}" tabindex="0"><td><b>${h(s.nom)}</b> ${h(s.prenom)}</td><td>${h(s.classe)}</td><td>${st.per?`${h(perLabel(st.per))} <span class="small muted">${h(periodeState(st.per))}</span>`:'<span class="muted">—</span>'}</td><td>${h(st.per?.entreprise||"—")}</td><td>${h(st.per?.tuteur||"—")}</td><td class="num">${st.fiches.length}</td><td class="num">${st.ents.length-st.fiches.length}</td><td class="num">${st.photos}</td><td><span class="status ${cls}">${lab}</span></td><td class="num"><b>${st.pct} %</b></td><td>${miniBornes(st.cnt)}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}

      <span class="status ${cls}">${lab}</span><span style="grid-column:1/-1">${miniBornes(st.cnt)}</span></button>`; }).join("")}</div>`
      :`<div class="card"><p>Aucun élève pour l'instant.</p><button class="btn primary" data-go="accounts">Créer les comptes élèves</button></div>`}
    ${list.length&&!isDesk()?`<button class="btn" id="csvBtn">Exporter le suivi (.csv)</button>`:""}

  </div>`;
}

/* PROFESSEUR — COMPTES */
let lastCreated=[]; let accSel=new Set(); let accCls="";
function accountsListHTML(classes){
  const list=S.students.filter(s=>!accCls||s.classe===accCls);
  const allOn=list.length&&list.every(s=>accSel.has(s.id));
  const nSel=list.filter(s=>accSel.has(s.id)).length;
  return `<div class="card"><div class="section-title"><h3>Comptes existants (${S.students.length})</h3></div>
    ${classes.length>1?`<label class="f">Afficher<select id="accFilter"><option value="">Toutes les classes</option>${classes.map(c=>`<option${c===accCls?" selected":""}>${h(c)}</option>`).join("")}</select></label>`:""}
    <div class="row"><button type="button" class="btn small danger" id="delSel"${nSel?"":" disabled"}>Supprimer la sélection${nSel?` (${nSel})`:""}</button></div>
    <div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="accAll" aria-label="Tout sélectionner"${allOn?" checked":""}></th><th>Élève</th><th>Classe</th><th>Identifiant</th>${Store.mode==="demo"?"<th>Code</th>":""}<th></th></tr></thead><tbody>
    ${list.map(s=>`<tr><td><input type="checkbox" class="accChk" value="${s.id}" aria-label="Sélectionner ${h(s.prenom)} ${h(s.nom)}"${accSel.has(s.id)?" checked":""}></td><td>${h(s.nom)} ${h(s.prenom)}</td><td>${h(s.classe)}</td><td class="mono">${h(s.identifiant)}</td>${Store.mode==="demo"?`<td class="mono">${h(s.code)}</td>`:""}<td><button type="button" class="btn small ghost" data-delstudent="${s.id}" aria-label="Supprimer ${h(s.prenom)} ${h(s.nom)}">Supprimer</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
}
async function runDeletion(list, doneMsg){
  const pr=$("#delProg"); if(pr){ pr.hidden=false; }
  try{ await Store.deleteStudents(list,(i,n,p)=>{ if(pr) pr.textContent=`Suppression ${i} / ${n} : ${p.prenom} ${p.nom}`; });
    list.forEach(p=>accSel.delete(p.id)); await refresh(); toast(doneMsg); render();
  }catch(x){ await refresh(); render(); toast(x.message||"Suppression impossible"); }
}
function viewAccounts(){
  const classes=[...new Set(S.students.map(s=>s.classe).filter(Boolean))].sort();
  return `<div class="stack">
    <div class="row between"><button class="btn small ghost" data-go="home">← Classe</button></div>
    <h1>Comptes et classes</h1>
    <form class="card" id="accForm">
      <h3>Créer des comptes</h3>
      <label class="f">Classe<input type="text" id="accCls" list="clsList" placeholder="ex. 1GEO" value="${h(S.classe||classes[0]||"")}"><datalist id="clsList">${classes.map(c=>`<option value="${h(c)}">`).join("")}</datalist></label>
      <label class="f">Élèves, un par ligne<span class="hint">NOM Prénom (copiez la liste depuis Pronote ou un tableur)</span><textarea id="accList" rows="6" placeholder="DUPONT Léa&#10;MARTIN Hugo"></textarea></label>
      <button class="btn primary" type="submit" id="accBtn">Créer les comptes</button>
